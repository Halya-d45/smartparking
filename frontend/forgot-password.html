<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Smart Parking Premium</title>

    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/premium.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        background: "#f9f7f2",
                        primary: "#3b82f6",
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-background min-h-screen flex items-center justify-center p-6 py-12 md:py-20">
    <div class="w-full max-w-[460px] animate-fade-in text-center relative z-10">
        <!-- Logo Section -->
        <div class="mb-10">
            <div
                class="w-16 h-16 bg-blue-600 rounded-2xl flex items-center justify-center shadow-xl shadow-blue-600/20 mx-auto mb-6">
                <i class="fas fa-lock text-white text-3xl"></i>
            </div>
            <h1 class="text-4xl font-black text-slate-900 tracking-tighter mb-2">Reset Password</h1>
            <p id="sub-text" class="text-gray-500 font-semibold uppercase text-[10px] tracking-[0.2em]">Verify your email to continue</p>
        </div>

        <!-- Card -->
        <div class="bg-white/70 backdrop-blur-3xl border border-black/5 rounded-[3rem] p-10 shadow-2xl shadow-black/5 text-left transition-all">
            
            <!-- Step 1: Email Verification -->
            <div id="step-1" class="space-y-6">
                <div>
                    <label class="block text-[11px] font-black text-gray-400 uppercase tracking-widest mb-3 ml-1">Email
                        Address</label>
                    <div
                        class="relative flex items-center bg-white rounded-2xl overflow-hidden border border-gray-100 shadow-inner focus-within:border-blue-200 transition-all">
                        <div class="w-12 flex items-center justify-center text-gray-300">
                            <i class="fas fa-envelope text-sm"></i>
                        </div>
                        <input type="email" id="reset-email" placeholder="mike@example.com"
                            class="flex-1 py-4 bg-transparent border-none outline-none font-bold text-slate-800 placeholder:text-gray-300">
                    </div>
                </div>

                <div class="pt-4">
                    <button id="verify-email-btn"
                        class="w-full py-5 bg-blue-600 text-white font-black text-sm rounded-[1.5rem] shadow-xl shadow-blue-600/20 hover:bg-blue-700 transition-all active:scale-95 flex items-center justify-center gap-3 group">
                        Verify Email
                        <i class="fas fa-arrow-right transition-transform group-hover:translate-x-1"></i>
                    </button>
                    <div class="text-center mt-4">
                        <a href="login.html" class="text-[10px] font-black text-gray-400 hover:text-blue-600 uppercase tracking-widest">Back to Login</a>
                    </div>
                </div>
            </div>

            <!-- Step 2: New Password input (Hidden initially) -->
            <div id="step-2" class="space-y-6 hidden">
                <div>
                    <label class="block text-[11px] font-black text-gray-400 uppercase tracking-widest mb-3 ml-1">New Password</label>
                    <div
                        class="relative flex items-center bg-white rounded-2xl overflow-hidden border border-gray-100 shadow-inner focus-within:border-blue-200 transition-all">
                        <div class="w-12 flex items-center justify-center text-gray-300">
                            <i class="fas fa-shield-halved text-sm"></i>
                        </div>
                        <input type="password" id="new-password" placeholder="••••••••"
                            class="flex-1 py-4 bg-transparent border-none outline-none font-bold text-slate-800 placeholder:text-gray-300">
                    </div>
                </div>
                
                <div>
                    <label class="block text-[11px] font-black text-gray-400 uppercase tracking-widest mb-3 ml-1">Confirm Password</label>
                    <div
                        class="relative flex items-center bg-white rounded-2xl overflow-hidden border border-gray-100 shadow-inner focus-within:border-blue-200 transition-all">
                        <div class="w-12 flex items-center justify-center text-gray-300">
                            <i class="fas fa-shield-halved text-sm"></i>
                        </div>
                        <input type="password" id="confirm-password" placeholder="••••••••"
                            class="flex-1 py-4 bg-transparent border-none outline-none font-bold text-slate-800 placeholder:text-gray-300">
                    </div>
                </div>

                <div class="pt-4">
                    <button id="reset-password-btn"
                        class="w-full py-5 bg-green-600 text-white font-black text-sm rounded-[1.5rem] shadow-xl shadow-green-600/20 hover:bg-green-700 transition-all active:scale-95 flex items-center justify-center gap-3 group">
                        Update Password
                        <i class="fas fa-check transition-transform group-hover:scale-110"></i>
                    </button>
                    <div class="text-center mt-4">
                        <a href="login.html" class="text-[10px] font-black text-gray-400 hover:text-blue-600 uppercase tracking-widest">Cancel</a>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Scripts -->
    <script src="js/config.js"></script>
    <script>
        const AUTH_API_LOCAL = `${CONFIG.API_BASE}/auth`;
        
        let verifiedEmail = "";

        document.getElementById('verify-email-btn').addEventListener('click', async () => {
            const emailInput = document.getElementById('reset-email').value;
            if (!emailInput) {
                alert("Please enter an email address");
                return;
            }

            try {
                const res = await fetch(`${AUTH_API_LOCAL}/verify-email`, {
                    method: "POST",
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: emailInput })
                });

                const data = await res.json();
                if (res.ok) {
                    verifiedEmail = emailInput;
                    // Transition to step 2
                    document.getElementById('step-1').classList.add('hidden');
                    document.getElementById('step-2').classList.remove('hidden');
                    document.getElementById('sub-text').innerText = "Create a new secure password";
                } else {
                    alert("Verification Failed: " + (data.error || "Email not found"));
                }
            } catch (err) {
                console.error(err);
                alert("Network error. Please try again.");
            }
        });

        document.getElementById('reset-password-btn').addEventListener('click', async () => {
            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;

            if (!newPassword || !confirmPassword) {
                alert("Please fill both password fields");
                return;
            }

            if (newPassword !== confirmPassword) {
                alert("Passwords do not match!");
                return;
            }

            try {
                const res = await fetch(`${AUTH_API_LOCAL}/reset-password`, {
                    method: "POST",
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: verifiedEmail, newPassword })
                });

                const data = await res.json();
                if (res.ok) {
                    alert("Password reset successfully! Please login with your new password.");
                    window.location.href = "login.html";
                } else {
                    alert("Reset Failed: " + (data.error || "Something went wrong"));
                }
            } catch (err) {
                console.error(err);
                alert("Network error. Please try again.");
            }
        });
    </script>
</body>

</html>
